[package]
name = "vcv-rs"
version = "0.1.0"
edition = "2024"
description = "Fast Visual Studio environment setup"
license = "MIT"
authors = ["joss13@gmail.com"]
repository = "https://github.com/ssoj13/vcv-rs"
homepage = "https://github.com/ssoj13/vcv-rs"
documentation = "https://docs.rs/vcv-rs"

[lib]
name = "vcv_rs"

[features]
default = []
# Windows-only `vcv` CLI (`cargo build -p vcv-rs --features cli`).
cli = []

[[bin]]
name = "vcv"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: registry probing + the CLI's arg parser. A non-Windows build of
# the library is a no-op stub and needs neither.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
clap = { version = "4", features = ["derive"] }
